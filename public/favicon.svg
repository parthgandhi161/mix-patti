<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1444"/>
      <stop offset="1" stop-color="#160821"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#fbf1de"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- three fanned aces: the highest hand in Teen Patti -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <!-- left card: ace of spades -->
    <g transform="translate(184,272) rotate(-16)">
      <rect x="-84" y="-117.5" width="168" height="235" rx="20" fill="url(#cardFront)" stroke="#d99b28" stroke-width="6"/>
      <text x="-58" y="-72" font-size="40" font-weight="700" fill="#2c1444">A</text>
      <text x="-58" y="-34" font-size="30" fill="#2c1444">&#9824;</text>
      <text x="0" y="34" font-size="130" fill="#2c1444" opacity="0.9">&#9824;</text>
    </g>

    <!-- right card: ace of diamonds -->
    <g transform="translate(328,272) rotate(16)">
      <rect x="-84" y="-117.5" width="168" height="235" rx="20" fill="url(#cardFront)" stroke="#d99b28" stroke-width="6"/>
      <text x="-58" y="-72" font-size="40" font-weight="700" fill="#d99b28">A</text>
      <text x="-58" y="-34" font-size="30" fill="#d99b28">&#9830;</text>
      <text x="0" y="34" font-size="130" fill="#d99b28" opacity="0.9">&#9830;</text>
    </g>

    <!-- center card: ace of hearts, drawn on top -->
    <g transform="translate(256,252)">
      <rect x="-88" y="-123" width="176" height="246" rx="22" fill="url(#cardFront)" stroke="#f4c64a" stroke-width="7"/>
      <text x="-60" y="-76" font-size="42" font-weight="700" fill="#ff4e8e">A</text>
      <text x="-60" y="-36" font-size="32" fill="#ff4e8e">&#9829;</text>
      <text x="0" y="38" font-size="140" fill="#ff4e8e" opacity="0.95">&#9829;</text>
    </g>
  </g>
</svg>
