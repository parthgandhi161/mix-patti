<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover + the dvh units in CSS keep the layout stable when
         mobile browser chrome slides in and out. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#160821" />
    <meta
      name="description"
      content="A randomizer and rulebook for Teen Patti variations. Tap to mix, get a twist, play."
    />

    <!-- Open Graph / Twitter card. og:image and og:url are absolute -
         %BASE_URL% (used below for manifest.json / apple-touch-icon.png)
         only resolves to the relative "/mix-patti/" base, not a full
         origin, so the GitHub Pages domain is hardcoded here. This is a
         second place that stores that domain, alongside vite.config.js's
         `base` - see CLAUDE.md's Deployment section. -->
    <meta property="og:title" content="Mix Patti" />
    <meta
      property="og:description"
      content="A randomizer and rulebook for Teen Patti variations. Tap to mix, get a twist, play."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://parthgandhi161.github.io/mix-patti/" />
    <meta property="og:image" content="https://parthgandhi161.github.io/mix-patti/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mix Patti - a randomizer and rulebook for Teen Patti variations"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mix Patti" />
    <meta
      name="twitter:description"
      content="A randomizer and rulebook for Teen Patti variations. Tap to mix, get a twist, play."
    />
    <meta name="twitter:image" content="https://parthgandhi161.github.io/mix-patti/og.png" />

    <!-- iOS has no requestFullscreen() for page content - installing to the
         home screen via these tags is the only way to get a chrome-free
         "fullscreen" experience there. See FullscreenToggle.jsx. -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mix Patti" />

    <title>Mix Patti</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
